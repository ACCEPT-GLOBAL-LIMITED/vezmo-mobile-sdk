# The sheet in dark mode (the phone is switched to dark before this runs): screenshots only, no payment.
# On the merchant-of-record demo, which shows every way to pay in the list (Cash App, Klarna, Amazon Pay).
appId: com.vezmo.example
---
- runFlow:
    file: ../../android/common/launch.yaml
    env:
      TRACK: mor
- runFlow: ../../../../../../e2e/maestro/session.yaml
- runFlow: ../../../../../../e2e/maestro/sheet.yaml
# Outside the US the sheet first offers the runner's own currency, which hides the USD-only methods: pay in USD.
- tapOn:
    text: "(.*[0-9][ ,]+)?USD"
    optional: true
- extendedWaitUntil:
    visible: "Cash App Pay"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: dark-01-sheet
- runFlow: ../../../../../../e2e/maestro/android/card-form.yaml
- takeScreenshot: dark-02-card-form

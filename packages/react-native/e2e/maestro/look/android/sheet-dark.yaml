# The sheet in dark mode (the phone is switched to dark before this runs): screenshots only, no payment.
appId: com.vezmo.example
---
# A fresh launch right after the last flow's clear-data can be killed by the system's late task cleanup: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      # A just-booted emulator can show a system "isn't responding" dialog over the app.
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "new-session"
          timeout: 30000
- tapOn:
    id: "new-session"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: dark-01-sheet
- tapOn: "Card"
- extendedWaitUntil:
    visible: "Card number"
    timeout: 20000
- takeScreenshot: dark-02-card-form

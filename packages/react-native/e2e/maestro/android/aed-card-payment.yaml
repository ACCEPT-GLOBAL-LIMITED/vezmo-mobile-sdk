# A card payment in the buyer's own currency (AED, as a phone in the UAE is offered): the sheet opens in dirhams,
# the card form opens on the first tap of Card, and the payment goes through priced in dirhams.
appId: com.vezmo.example
---
# A fresh launch right after the last flow's clear-data can be killed by the system's late task cleanup: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      # A just-booted emulator can show a system "isn't responding" dialog over the app.
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "new-session"
          timeout: 30000
# The sandbox offers dirhams, as to a buyer in the UAE (the runners are in the US): the example reads it from a link.
- openLink: "vezmoexample://e2e?offerCurrency=AED"
- extendedWaitUntil:
    visible:
      id: "new-session"
    timeout: 30000
- tapOn:
    id: "new-session"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
# Dirhams first, the price's dollars beside them.
- assertVisible: "Pay in"
- assertVisible: ".*AED.*"
- takeScreenshot: aed-01-sheet
# Dollars, then dirhams again: the card flow is set up again for each, and the card form still opens on the first tap.
# Quickly, as a buyer might: back to dirhams before the dollars are set up, then straight to Card (a phone in the UAE
# showed the engine's "not configured" here, its Card row up while the card flow was still being set up).
- tapOn:
    id: "vezmo-pay-in-price"
    waitToSettleTimeoutMs: 100
- tapOn:
    id: "vezmo-pay-in-local"
    waitToSettleTimeoutMs: 100
- tapOn: "Card"
- extendedWaitUntil:
    visible: "Card number"
    timeout: 15000
- tapOn: "Card number"
# The form moves on by itself: card number, then expiry, then CVC.
- inputText: "4242424242424242"
- inputText: "1234"
- inputText: "123"
- tapOn: "ZIP Code"
- inputText: "10001"
- hideKeyboard
- takeScreenshot: aed-02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: aed-03-card-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: aed-04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: aed-05-result
- assertVisible: "Payment successful"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*succeeded.*"
- takeScreenshot: aed-06-back-in-app

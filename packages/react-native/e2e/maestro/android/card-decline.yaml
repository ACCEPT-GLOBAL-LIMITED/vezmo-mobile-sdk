# A declined card (4000 0000 0000 0002) on the run's business model (TRACK): the sheet shows the reason and stays ready
# for another card.
appId: com.vezmo.example
---
- runFlow: common/launch.yaml
- runFlow: ../../../../../e2e/maestro/session.yaml
- runFlow: ../../../../../e2e/maestro/sheet.yaml
- runFlow:
    file: ../../../../../e2e/maestro/android/card.yaml
    env:
      CARD: "4000000000000002"
      SHOT: decline
- runFlow: ../../../../../e2e/maestro/api-ready.yaml
- tapOn:
    id: "vezmo-pay"
# The bank says no: the sheet stays open with the reason, ready for another card.
- extendedWaitUntil:
    visible: "(?i).*(declined|didn.t go through).*"
    timeout: 60000
- takeScreenshot: decline-01-message
- assertVisible:
    id: "vezmo-pay"

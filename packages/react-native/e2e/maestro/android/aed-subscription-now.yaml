# A subscription paid today in the buyer's own currency (AED) on the run's business model (TRACK): the sheet opens in
# dirhams, the card form opens on the first tap of Card, and the first payment goes through (a phone in the UAE once
# showed "not configured" here).
appId: com.vezmo.example
---
- runFlow:
    file: common/launch.yaml
    env:
      OFFER_CURRENCY: AED
- runFlow:
    file: ../../../../../e2e/maestro/subscribe.yaml
    env:
      BUTTON: subscribe-now
- assertVisible: "Due today"
- assertVisible: "Pay in"
- assertVisible: ".*AED.*"
- takeScreenshot: aed-sub-01-sheet
# The card form opens on the first tap of Card.
- tapOn: "Card"
- extendedWaitUntil:
    visible: "Card number"
    timeout: 15000
- runFlow:
    file: ../../../../../e2e/maestro/android/card-entry.yaml
    env:
      CARD: "4242424242424242"
      SHOT: aed-sub
- runFlow:
    file: ../../../../../e2e/maestro/pay.yaml
    env:
      SHOT: aed-sub
- assertVisible: "You’re subscribed"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*active.*"
- takeScreenshot: aed-sub-06-back-in-app

# A redirect method end to end on the merchant-of-record business (the only one with Cash App Pay on): Cash App Pay
# opens its (test) authorization page in the browser, the buyer approves, and the app comes back through its return
# link with the result.
appId: com.vezmo.example
tags:
  - mor-only
---
- runFlow:
    file: common/launch.yaml
    env:
      TRACK: mor
- runFlow: ../../../../../e2e/maestro/session.yaml
- runFlow: ../../../../../e2e/maestro/sheet.yaml
# Outside the US the sheet first offers the runner's own currency, and Cash App, Klarna and Amazon Pay are
# USD-only: pay in USD.
- tapOn:
    text: "(.*[0-9][ ,]+)?USD"
    optional: true
- extendedWaitUntil:
    visible: "Cash App Pay"
    timeout: 30000
- takeScreenshot: cashapp-01-sheet
- tapOn: "Cash App Pay"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: cashapp-02-chosen
- runFlow:
    file: ../../../../../e2e/maestro/android/redirect.yaml
    env:
      SHOT: cashapp
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: cashapp-05-result
- assertVisible: "(?i)(payment successful|payment received)"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*(succeeded|processing).*"
- takeScreenshot: cashapp-06-back-in-app

# The same card payment on the merchant-of-record track (the sandbox's MoR business): Vezmo's platform account
# charges, not a connected one. Both tracks must pay the same way.
appId: com.vezmo.example
---
# A fresh launch right after the last flow's clear-data can be killed by the system's late task cleanup: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      # A just-booted emulator can show a system "isn't responding" dialog over the app.
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "new-session"
          timeout: 30000
- tapOn:
    id: "new-session-mor"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- takeScreenshot: mor-01-sheet
- tapOn: "Card"
- extendedWaitUntil:
    visible: "Card number"
    timeout: 15000
- tapOn: "Card number"
# The form moves on by itself: card number, then expiry, then CVC.
- inputText: "4242424242424242"
- inputText: "1234"
- inputText: "123"
- tapOn: "ZIP Code"
- inputText: "10001"
- hideKeyboard
- takeScreenshot: mor-02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: mor-03-card-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: mor-04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: mor-05-result
- assertVisible: "Payment successful"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*succeeded.*"
- takeScreenshot: mor-06-back-in-app

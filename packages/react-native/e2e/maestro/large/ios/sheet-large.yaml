# The sheet at the largest text size (set before this runs; the sheet's text grows only to the first accessibility
# size): screenshots only, no payment.
appId: com.vezmo.example
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: "new-session"
    timeout: 30000
# The buttons sit below the fold at this size: the session's steps are inline, scrolled to.
- runFlow: ../../../../../../e2e/maestro/api-ready.yaml
- tapOn:
    id: "new-session"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 75000
- scrollUntilVisible:
    element:
      id: "pay"
    direction: UP
    timeout: 10000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: large-01-sheet

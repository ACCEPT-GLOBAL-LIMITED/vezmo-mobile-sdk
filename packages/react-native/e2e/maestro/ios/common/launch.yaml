# Launches the example fresh with the business model the run picks (TRACK: `connect`, or `mor`, the merchant of record,
# with Cash App, Klarna and Amazon Pay on) and, with OFFER_CURRENCY (e.g. AED), the sandbox offering the buyer that
# currency, as to a buyer abroad (the runners are in the US). Both are launch arguments; the app shows the settings it
# took on its status line, and nothing is tapped before.
appId: com.vezmo.example
---
- launchApp:
    clearState: true
    arguments:
      track: "${typeof TRACK == 'undefined' ? 'connect' : TRACK}"
      offerCurrency: "${typeof OFFER_CURRENCY == 'undefined' ? '' : OFFER_CURRENCY}"
- extendedWaitUntil:
    visible:
      id: "new-session"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "status"
      text: "Run: ${typeof TRACK == 'undefined' ? 'connect' : TRACK}.*"
    timeout: 30000

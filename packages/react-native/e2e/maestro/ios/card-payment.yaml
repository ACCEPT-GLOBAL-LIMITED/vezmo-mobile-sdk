# A card payment on a dev sandbox session, end to end: the Vezmo sheet, the native card form, Vezmo's server
# pricing and confirming it, 3D Secure on the device, and the result back in the app.
appId: com.vezmo.example
---
- launchApp:
    clearState: true
- tapOn:
    id: "new-session"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- takeScreenshot: 01-sheet
- tapOn: "Card"
- extendedWaitUntil:
    visible: "Card number"
    timeout: 15000
- tapOn: "Card number"
# The form moves on by itself: card number, then expiry, then CVC.
- inputText: "4242424242424242"
- inputText: "1234"
- inputText: "123"
- takeScreenshot: 01b-card-form
- tapOn:
    text: "ZIP.*"
    optional: true
- inputText: "10001"
- hideKeyboard
- takeScreenshot: 02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-card-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: 05-result
- assertVisible: "Payment successful"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*succeeded.*"
- takeScreenshot: 06-back-in-app

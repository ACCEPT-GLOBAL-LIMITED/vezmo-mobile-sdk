# Opens the Vezmo payment sheet on a sandbox session from dev and records what it shows.
appId: com.vezmo.example
---
- launchApp:
    clearState: true
- tapOn:
    id: "new-session"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Payments secured by Vezmo · Test mode"
    timeout: 45000
- takeScreenshot: 01-sheet
- extendedWaitUntil:
    visible: "Card"
    timeout: 45000
- takeScreenshot: 02-element-loaded
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-card-form

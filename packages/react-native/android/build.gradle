buildscript {
  ext.VezmoReactNative = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    // The native payment engine the element runs on, pinned exactly (same release as the iOS pod).
    paymentEngineVersion: "23.23.0"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }
    return VezmoReactNative[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

android {
  namespace "com.vezmo.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.stripe:stripe-android:${getExtOrDefault('paymentEngineVersion')}"
  // Used directly by the element's host (also pulled in by the engine; declared so they are on our classpath).
  implementation platform("androidx.compose:compose-bom:2025.06.01")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.foundation:foundation"
  implementation "androidx.activity:activity-compose:1.10.1"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.1"
  implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1"
  implementation "androidx.savedstate:savedstate-ktx:1.3.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}

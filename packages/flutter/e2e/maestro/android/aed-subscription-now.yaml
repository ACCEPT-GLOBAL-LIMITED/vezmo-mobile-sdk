# A merchant-of-record subscription paid today in the buyer's own currency (AED): the sheet opens in dirhams, the
# card form opens on the first tap of Card, and the first payment goes through (a phone in the UAE once showed "not configured" here).
appId: com.vezmo.example.flutter
---
# A fresh launch right after the last flow's clear-data can be killed by the system's late task cleanup: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          # The sandbox offers dirhams, as to a buyer in the UAE (the runners are in the US).
          arguments:
            offerCurrency: AED
      # A just-booted emulator can show a system "isn't responding" dialog over the app.
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "new-session"
          timeout: 30000
- scrollUntilVisible:
    element:
      id: "subscribe-now"
    direction: DOWN
    centerElement: true # tap it mid-screen, clear of the home indicator and gesture bar
- tapOn:
    id: "subscribe-now"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- assertVisible: "Due today"
- assertVisible: "Pay in"
- assertVisible: ".*AED.*"
- takeScreenshot: aed-sub-01-sheet
- tapOn: "Card"
- extendedWaitUntil:
    visible: "Card number"
    timeout: 15000
- tapOn: "Card number"
# The form moves on by itself: card number, then expiry, then CVC.
- inputText: "4242424242424242"
- inputText: "1234"
- inputText: "123"
- tapOn: "ZIP Code"
- inputText: "10001"
- hideKeyboard
- takeScreenshot: aed-sub-02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: aed-sub-03-card-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: aed-sub-04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: aed-sub-05-result
- assertVisible: "You’re subscribed"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*active.*"
- takeScreenshot: aed-sub-06-back-in-app

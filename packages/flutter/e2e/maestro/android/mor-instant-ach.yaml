# Instant ACH end to end on the merchant-of-record business (it offers Instant ACH): the sheet's Instant ACH row opens
# the bank step, the buyer links the sandbox's "Success" test bank, and pays; the receipt says Instant ACH.
appId: com.vezmo.example.flutter
tags:
  - mor-only
---
- runFlow:
    file: common/launch.yaml
    env:
      TRACK: mor
- runFlow: ../../../../../e2e/maestro/session.yaml
- runFlow: ../../../../../e2e/maestro/sheet.yaml
# Outside the US the sheet first offers the runner's own currency; Instant ACH is in US dollars only.
- tapOn:
    text: "(.*[0-9][ ,]+)?USD"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-instant-ach-row"
    timeout: 30000
- takeScreenshot: iach-01-sheet
- tapOn:
    id: "vezmo-instant-ach-row"
- runFlow:
    file: ../../../../../e2e/maestro/bank.yaml
    env:
      SHOT: iach
- extendedWaitUntil:
    visible: "Instant ACH •••• [0-9]{4}"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: iach-07-linked
- runFlow:
    file: ../../../../../e2e/maestro/pay.yaml
    env:
      SHOT: iach
- assertVisible: "(?i)(payment successful|payment received)"
- assertVisible: ".*Instant ACH.*"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*(succeeded|processing).*"
- takeScreenshot: iach-06-back-in-app

# A redirect method end to end on the merchant-of-record track: Cash App Pay opens its (test) authorization page in
# the browser, the buyer approves, and the app comes back through its return link with the result.
appId: com.vezmo.example.flutter
---
# A fresh launch right after the last flow's clear-data can be killed by the system's late task cleanup: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      # A just-booted emulator can show a system "isn't responding" dialog over the app.
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "new-session-mor"
          timeout: 30000
- tapOn:
    id: "new-session-mor"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
# Outside the US the sheet first offers the runner's own currency, and Cash App, Klarna and Amazon Pay are
# USD-only: pay in USD.
- tapOn:
    text: "(.*[0-9][ ,]+)?USD"
    optional: true
- extendedWaitUntil:
    visible: "Cash App Pay"
    timeout: 30000
- takeScreenshot: cashapp-01-sheet
- tapOn: "Cash App Pay"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: cashapp-02-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: cashapp-03-redirect
# A fresh emulator's browser asks its first-run questions before showing the page.
- tapOn:
    text: "(?i)(use without an account|accept & continue|accept and continue)"
    optional: true
- tapOn:
    text: "(?i)(no thanks|no, thanks)"
    optional: true
- extendedWaitUntil:
    visible: "(?i).*authori[sz]e test payment.*"
    timeout: 60000
- takeScreenshot: cashapp-04-test-page
- tapOn: "(?i).*authori[sz]e test payment.*"
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: cashapp-05-result
- assertVisible: "(?i)(payment successful|payment received)"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*(succeeded|processing).*"
- takeScreenshot: cashapp-06-back-in-app

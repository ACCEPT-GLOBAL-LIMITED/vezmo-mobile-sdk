# A card payment on a dev sandbox session, end to end, on the run's business model (TRACK): the Vezmo sheet, the native
# card form, Vezmo's server pricing and confirming it, 3D Secure on the device, and the result back in the app.
appId: com.vezmo.example.flutter
---
- runFlow: common/launch.yaml
- runFlow: ../../../../../e2e/maestro/session.yaml
- runFlow: ../../../../../e2e/maestro/sheet.yaml
- takeScreenshot: card-01-sheet
- runFlow:
    file: ../../../../../e2e/maestro/ios/card.yaml
    env:
      CARD: "4242424242424242"
      SHOT: card
- runFlow:
    file: ../../../../../e2e/maestro/pay.yaml
    env:
      SHOT: card
- assertVisible: "Payment successful"
- tapOn:
    id: "vezmo-done"
    retryTapIfNoChange: true
- assertVisible:
    id: "result"
    text: ".*succeeded.*"
- takeScreenshot: card-06-back-in-app

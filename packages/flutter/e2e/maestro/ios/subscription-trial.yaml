# A subscription with a 7-day free trial, started in the app: nothing due today, the card saved for the renewals
# (a setup on our server), and the subscription back in the app as trialing.
appId: com.vezmo.example.flutter
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: "subscribe"
    direction: DOWN
    centerElement: true # tap it mid-screen, clear of the home indicator and gesture bar
- tapOn:
    id: "subscribe"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- assertVisible: "Due today"
# The plan block reads as one element to VoiceOver: its label holds both lines.
- assertVisible: ".*7-day free trial.*"
- takeScreenshot: sub-trial-01-sheet
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sub-trial-01a-after-card-tap
# The card form opens as its own sheet; its fields are labelled differently across iOS versions, so wait for the form.
- extendedWaitUntil:
    visible: "(?i)(add card|card information|card number)"
    timeout: 20000
# Each field by its id (iOS reads the card field's label with the supported brands appended).
- tapOn:
    id: "Card number"
- inputText: "4242424242424242"
- tapOn:
    id: "MM / YY"
- inputText: "1234"
- tapOn:
    id: "CVC"
- inputText: "123"
- tapOn:
    id: "ZIP"
- inputText: "10001"
- takeScreenshot: sub-trial-01b-card-form
# The number pad has no return key: its Done bar closes it.
- tapOn:
    text: "Done"
    optional: true
- takeScreenshot: sub-trial-02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: sub-trial-03-card-chosen
# A busy simulator can drop a tap while the card form closes: tap again if nothing changed.
- tapOn:
    id: "vezmo-pay"
    retryTapIfNoChange: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: sub-trial-04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: sub-trial-05-result
- assertVisible: "Your free trial has started"
- tapOn:
    id: "vezmo-done"
    retryTapIfNoChange: true
- assertVisible:
    id: "result"
    text: ".*trialing.*"
- takeScreenshot: sub-trial-06-back-in-app

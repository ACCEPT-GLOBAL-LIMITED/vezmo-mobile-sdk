# A bad session token: the app shows the error and the sheet never opens.
appId: com.vezmo.example.flutter
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "client-token"
    timeout: 30000
# A session token the server doesn't know: the app hears it back as an error, the sheet never opens.
- tapOn:
    id: "client-token"
- inputText: "not-a-real-session-token"
# Tapping outside the field closes the keyboard.
- tapOn: "Northwind Audio"
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible:
      id: "status"
      text: "Could not load.*"
    timeout: 30000
- takeScreenshot: bad-token-01

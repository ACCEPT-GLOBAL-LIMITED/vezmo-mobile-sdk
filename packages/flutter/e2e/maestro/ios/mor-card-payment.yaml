# The same card payment on the merchant-of-record track (the sandbox's MoR business): Vezmo's platform account
# charges, not a connected one. Both tracks must pay the same way.
appId: com.vezmo.example.flutter
---
- launchApp:
    clearState: true
- tapOn:
    id: "new-session-mor"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- takeScreenshot: mor-01-sheet
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: mor-01a-after-card-tap
# The card form opens as its own sheet; its fields are labelled differently across iOS versions, so wait for the form.
- extendedWaitUntil:
    visible: "(?i)(add card|card information|card number)"
    timeout: 20000
# Each field by its id (iOS reads the card field's label with the supported brands appended).
- tapOn:
    id: "Card number"
- inputText: "4242424242424242"
- tapOn:
    id: "MM / YY"
- inputText: "1234"
- tapOn:
    id: "CVC"
- inputText: "123"
- tapOn:
    id: "ZIP"
- inputText: "10001"
- takeScreenshot: mor-01b-card-form
# The number pad has no return key: its Done bar closes it.
- tapOn:
    text: "Done"
    optional: true
- takeScreenshot: mor-02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: mor-03-card-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: mor-04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: mor-05-result
- assertVisible: "Payment successful"
- tapOn:
    id: "vezmo-done"
- assertVisible:
    id: "result"
    text: ".*succeeded.*"
- takeScreenshot: mor-06-back-in-app

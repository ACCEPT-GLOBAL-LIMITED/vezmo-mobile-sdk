# A subscription paid today on the run's business model (TRACK): the first $9.99 charged by our server (3D Secure if
# the bank asks), the card kept for the renewals, and the subscription back in the app as active.
appId: com.vezmo.example.native
---
- runFlow: common/launch.yaml
- runFlow:
    file: ../../../../e2e/maestro/subscribe.yaml
    env:
      BUTTON: subscribe-now
- assertVisible: "Due today"
- takeScreenshot: sub-now-01-sheet
- runFlow:
    file: ../../../../e2e/maestro/ios/card.yaml
    env:
      CARD: "4242424242424242"
      SHOT: sub-now
- runFlow:
    file: ../../../../e2e/maestro/pay.yaml
    env:
      SHOT: sub-now
- assertVisible: "You’re subscribed"
- tapOn:
    id: "vezmo-done"
    retryTapIfNoChange: true
- assertVisible:
    id: "result"
    text: ".*active.*"
- takeScreenshot: sub-now-06-back-in-app

# A merchant-of-record subscription paid today in the buyer's own currency (AED): the sheet opens in dirhams, the
# card form opens on the first tap of Card, and the first payment goes through.
appId: com.vezmo.example.native
---
- launchApp:
    clearState: true
    # The sandbox offers dirhams, as to a buyer in the UAE (the runners are in the US).
    arguments:
      offerCurrency: AED
- tapOn:
    id: "subscribe-now"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- assertVisible: "Due today"
- assertVisible: "Pay in"
- assertVisible: ".*AED.*"
- takeScreenshot: aed-sub-01-sheet
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: aed-sub-01a-after-card-tap
# The card form opens as its own sheet; its fields are labelled differently across iOS versions, so wait for the form.
- extendedWaitUntil:
    visible: "(?i)(add card|card information|card number)"
    timeout: 20000
# Each field by its id (iOS reads the card field's label with the supported brands appended).
- tapOn:
    id: "Card number"
- inputText: "4242424242424242"
- tapOn:
    id: "MM / YY"
- inputText: "1234"
- tapOn:
    id: "CVC"
- inputText: "123"
- tapOn:
    id: "ZIP"
- inputText: "10001"
- takeScreenshot: aed-sub-01b-card-form
# The number pad has no return key: its Done bar closes it.
- tapOn:
    text: "Done"
    optional: true
- takeScreenshot: aed-sub-02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: aed-sub-03-card-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: aed-sub-04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: aed-sub-05-result
- assertVisible: "You’re subscribed"
- tapOn:
    id: "vezmo-done"
    retryTapIfNoChange: true
- assertVisible:
    id: "result"
    text: ".*active.*"
- takeScreenshot: aed-sub-06-back-in-app

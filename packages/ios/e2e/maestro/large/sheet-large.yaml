# The sheet at a larger text size (the phone is set to the first accessibility size before this runs): its text grows
# with the buyer's setting and the layout holds. Screenshots only, no payment.
appId: com.vezmo.example.native
---
- runFlow: ../common/launch.yaml
- runFlow: ../../../../../e2e/maestro/session.yaml
- runFlow: ../../../../../e2e/maestro/sheet.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: large-01-sheet
- tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "result"
      text: ".*canceled.*"
    timeout: 15000
# A subscription's plan block and authorization at the same size.
- runFlow:
    file: ../../../../../e2e/maestro/subscribe.yaml
    env:
      BUTTON: subscribe
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: large-02-subscription

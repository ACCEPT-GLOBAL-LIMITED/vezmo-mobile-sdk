# A card payment on a dev sandbox session, end to end: the Vezmo sheet, the native card form, Vezmo's server
# pricing and confirming it, 3D Secure on the device, and the result back in the app.
appId: com.vezmo.example.native
---
- launchApp:
    clearState: true
- tapOn:
    id: "new-session"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- takeScreenshot: 01-sheet
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01a-after-card-tap
# The card form opens as its own sheet; its fields are labelled differently across iOS versions, so wait for the form.
- extendedWaitUntil:
    visible: "(?i)(add card|card information|card number)"
    timeout: 20000
# Each field by its id (iOS reads the card field's label with the supported brands appended).
- tapOn:
    id: "Card number"
- inputText: "4242424242424242"
- tapOn:
    id: "MM / YY"
- inputText: "1234"
- tapOn:
    id: "CVC"
- inputText: "123"
- tapOn:
    id: "ZIP"
- inputText: "10001"
- takeScreenshot: 01b-card-form
# The number pad has no return key: its Done bar closes it.
- tapOn:
    text: "Done"
    optional: true
- takeScreenshot: 02-card-filled
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-card-chosen
- tapOn:
    id: "vezmo-pay"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 04-after-pay
# 3D Secure (the platform asks for it on every card): the test challenge, if shown.
- tapOn:
    text: "(?i)complete.*"
    optional: true
- tapOn:
    text: "(?i)submit"
    optional: true
- extendedWaitUntil:
    visible:
      id: "vezmo-result-title"
    timeout: 90000
- takeScreenshot: 05-result
- assertVisible: "Payment successful"
- tapOn:
    id: "vezmo-done"
    retryTapIfNoChange: true
- assertVisible:
    id: "result"
    text: ".*succeeded.*"
- takeScreenshot: 06-back-in-app

# The merchant-of-record sheet in dark mode, with the pay-later and Cash App rows (screenshot only, no payment).
appId: com.vezmo.example.native
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-session-mor"
    timeout: 30000
- tapOn:
    id: "new-session-mor"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Cash App Pay"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: dark-03-mor-sheet

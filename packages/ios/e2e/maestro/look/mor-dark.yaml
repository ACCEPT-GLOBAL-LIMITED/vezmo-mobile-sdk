# The merchant-of-record sheet in dark mode, with the pay-later and Cash App rows (screenshot only, no payment).
appId: com.vezmo.example.native
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-session-mor"
    timeout: 30000
- tapOn:
    id: "new-session-mor"
- extendedWaitUntil:
    visible: "Session ready."
    timeout: 30000
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
# Outside the US the sheet first offers the runner's own currency, and Cash App, Klarna and Amazon Pay are
# USD-only: pay in USD.
- tapOn:
    text: "(.*[0-9][ ,]+)?USD"
    optional: true
- extendedWaitUntil:
    visible: "Cash App Pay"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: dark-03-mor-sheet

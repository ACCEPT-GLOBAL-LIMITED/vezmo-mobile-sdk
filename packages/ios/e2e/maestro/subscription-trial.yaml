# A subscription with a 7-day free trial on the run's business model (TRACK), started in the app: nothing due today,
# the card saved for the renewals (a setup on our server), and the subscription back in the app as trialing.
appId: com.vezmo.example.native
---
- runFlow: common/launch.yaml
- runFlow:
    file: ../../../../e2e/maestro/subscribe.yaml
    env:
      BUTTON: subscribe
- assertVisible: "Due today"
# The plan block reads as one element to VoiceOver: its label holds both lines.
- assertVisible: ".*7-day free trial.*"
- takeScreenshot: sub-trial-01-sheet
- runFlow:
    file: ../../../../e2e/maestro/ios/card.yaml
    env:
      CARD: "4242424242424242"
      SHOT: sub-trial
- runFlow:
    file: ../../../../e2e/maestro/pay.yaml
    env:
      SHOT: sub-trial
- assertVisible: "Your free trial has started"
- tapOn:
    id: "vezmo-done"
    retryTapIfNoChange: true
- assertVisible:
    id: "result"
    text: ".*trialing.*"
- takeScreenshot: sub-trial-06-back-in-app

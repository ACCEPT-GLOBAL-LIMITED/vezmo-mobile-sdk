# The buyer closes the sheet: the app gets "canceled".
appId: com.vezmo.example.nativeapp
tags:
  - connect-only
---
- runFlow: ../common/launch.yaml
- runFlow: ../../../../../e2e/maestro/session.yaml
- runFlow: ../../../../../e2e/maestro/sheet.yaml
- takeScreenshot: cancel-01-sheet
# Closing the sheet is not an error: the app gets "canceled".
- tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "result"
      text: ".*canceled.*"
    timeout: 15000
# The back button cancels too.
- tapOn:
    id: "pay"
- extendedWaitUntil:
    visible: "Card"
    timeout: 60000
- back
- extendedWaitUntil:
    visible:
      id: "result"
      text: ".*canceled.*"
    timeout: 15000

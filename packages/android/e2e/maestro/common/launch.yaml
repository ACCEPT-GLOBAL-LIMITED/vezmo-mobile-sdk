# Launches the example fresh on the business model the run picks (TRACK: `connect`, or `mor`, the merchant of record,
# with Cash App, Klarna and Amazon Pay on) and, with OFFER_CURRENCY (e.g. AED), the sandbox offering the buyer that
# currency, as to a buyer abroad (the runners are in the US). Both are intent extras the example reads.
appId: com.vezmo.example.nativeapp
---
# A fresh launch right after the last flow's clear-data can be killed by the system's late task cleanup: retry it.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          arguments:
            track: "${typeof TRACK == 'undefined' ? 'connect' : TRACK}"
            offerCurrency: "${typeof OFFER_CURRENCY == 'undefined' ? '' : OFFER_CURRENCY}"
      # A just-booted emulator can show a system "isn't responding" dialog over the app.
      - tapOn:
          text: "Wait"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "new-session"
          timeout: 30000

name: React Native SDK e2e

# Pays on the dev sandbox from the example app, on an Android emulator and an iPhone simulator, once per business model
# (Connect and merchant of record, in parallel). Sessions come from dev's demo endpoint (TEST mode only), so this repo
# holds no key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/react-native/**'
      - 'e2e/**'
      - '.github/actions/**'
      - '.github/scripts/maestro-test.sh'
      - '.github/workflows/react-native-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: packages/react-native

env:
  EXPO_PUBLIC_VEZMO_DEMO_URL: https://api.dev.vezmo.com/api/v1/demo/mobile-session
  EXPO_PUBLIC_VEZMO_API_BASE: https://api.dev.vezmo.com/api/v1

jobs:
  android:
    name: Android emulator (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        track: [connect, mor]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'
      - name: Accept Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
      - name: Prebuild the example app
        run: yarn example expo prebuild --platform android --no-install
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-e2e-${{ hashFiles('packages/react-native/android/build.gradle', 'packages/react-native/yarn.lock') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Build the release app (JS bundled in)
        working-directory: packages/react-native/example/android
        env:
          JAVA_OPTS: '-XX:MaxHeapSize=6g'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -Dorg.gradle.jvmargs=-Xmx4g
      - uses: ./.github/actions/maestro
      - name: Run the flows on an emulator
        uses: ./.github/actions/android-emulator
        with:
          working-directory: packages/react-native
          # One command per line. The dark mode and largest-text screenshots run once, with the Connect flows.
          script: |
            adb shell settings put global hide_error_dialogs 1
            # Keep the whole run's log: a failure early in the run is otherwise rotated out by the time it is saved.
            adb logcat -G 16M
            adb install example/android/app/build/outputs/apk/release/app-release.apk
            ../../.github/scripts/maestro-test.sh ${{ matrix.track }} e2e/out/flows e2e/maestro/android || (adb exec-out screencap -p > e2e/out/failure.png; adb logcat -d > e2e/out/logcat.txt; exit 1)
            [ ${{ matrix.track }} != connect ] || adb shell "cmd uimode night yes"
            [ ${{ matrix.track }} != connect ] || ../../.github/scripts/maestro-test.sh connect e2e/out/look e2e/maestro/look/android || (adb exec-out screencap -p > e2e/out/failure-dark.png; exit 1)
            # The largest text size the phone offers, light: the sheet's text grows up to the first accessibility size.
            [ ${{ matrix.track }} != connect ] || adb shell "cmd uimode night no"
            [ ${{ matrix.track }} != connect ] || adb shell settings put system font_scale 2.0
            [ ${{ matrix.track }} != connect ] || ../../.github/scripts/maestro-test.sh connect e2e/out/large e2e/maestro/large/android || (adb exec-out screencap -p > e2e/out/failure-large.png; exit 1)
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-e2e-${{ matrix.track }}
          path: |
            packages/react-native/e2e/out
            packages/react-native/*.png
            packages/react-native/e2e/**/*.png

  ios:
    name: iOS simulator (${{ matrix.track }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        track: [connect, mor]
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable
      # Booted (and warmed) before the build: a just-booted simulator's first minutes are busy.
      - uses: ./.github/actions/ios-simulator
      - name: Prebuild the example app (installs pods)
        run: yarn example expo prebuild --platform ios
      - name: Build the release app for the simulator (JS bundled in)
        working-directory: packages/react-native/example/ios
        run: >
          xcodebuild -workspace VezmoExample.xcworkspace -scheme VezmoExample -configuration Release
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO -quiet
      - uses: ./.github/actions/dev-api
      - name: Run the flows
        run: |
          xcrun simctl install "$UDID" example/ios/build/Build/Products/Release-iphonesimulator/VezmoExample.app
          ../../.github/scripts/maestro-test.sh ${{ matrix.track }} e2e/out-ios/flows e2e/maestro/ios || { xcrun simctl io "$UDID" screenshot e2e/out-ios/failure.png; exit 1; }
      # Once, with the Connect flows.
      - name: The sheet in dark mode and at the largest text size
        if: matrix.track == 'connect'
        run: |
          xcrun simctl ui "$UDID" appearance dark
          ../../.github/scripts/maestro-test.sh connect e2e/out-ios/look e2e/maestro/look/ios || { xcrun simctl io "$UDID" screenshot e2e/out-ios/failure-dark.png; exit 1; }
          # Dynamic Type at its largest, light: the sheet's text grows only up to the first accessibility size.
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl ui "$UDID" content_size accessibility-extra-extra-extra-large
          ../../.github/scripts/maestro-test.sh connect e2e/out-ios/large e2e/maestro/large/ios || { xcrun simctl io "$UDID" screenshot e2e/out-ios/failure-large.png; exit 1; }
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-e2e-${{ matrix.track }}
          path: packages/react-native/e2e/out-ios

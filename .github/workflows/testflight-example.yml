name: Example app to TestFlight

# Builds the example app (paying on the dev sandbox) and sends it to TestFlight, so a real iPhone can try the sheet and
# the real Apple Pay button. Run by hand. Needs the App Store Connect API key secrets: ASC_KEY_ID, ASC_ISSUER_ID and
# VEZMOAPPLE (the .p8 file's text). Each run signs with a temporary distribution certificate and App Store profile
# made through that key (.github/scripts/asc-signing.mjs) and removed at the end; team 6SU5Q643PG.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/react-native

env:
  EXPO_PUBLIC_VEZMO_DEMO_URL: https://api.dev.vezmo.com/api/v1/demo/mobile-session
  EXPO_PUBLIC_VEZMO_API_BASE: https://api.dev.vezmo.com/api/v1

jobs:
  testflight:
    name: Build and upload (iOS)
    runs-on: macos-15
    timeout-minutes: 75
    env:
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.VEZMOAPPLE }}
        run: |
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "Add ASC_KEY_ID, ASC_ISSUER_ID and VEZMOAPPLE (the .p8) to the repo's Actions secrets."; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          # Rebuild the .p8 from what was pasted (a paste often loses its line breaks or the BEGIN/END lines).
          # Only what sits between the BEGIN and END lines (anything pasted around the key is dropped).
          body=$(printf '%s' "$ASC_KEY_P8" | perl -0777 -ne 'print $1 if /-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----/s' | tr -d ' \r\n\t')
          # Only shapes are printed, never the key: an App Store Connect key is about 200 base64 characters.
          echo "The key secret: BEGIN $(printf '%s' "$ASC_KEY_P8" | grep -c 'BEGIN PRIVATE KEY'), END $(printf '%s' "$ASC_KEY_P8" | grep -c 'END PRIVATE KEY'), ${#body} base64 characters between them."
          test -n "$body" || { echo "No BEGIN/END PRIVATE KEY block in the key secret: paste the whole .p8 file's text."; exit 1; }
          case "$body" in *[!A-Za-z0-9+/=]*) echo "The key secret holds characters a .p8 never has: paste the .p8 file's text again."; exit 1;; esac
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s\n' "$body" | fold -w 64; echo '-----END PRIVATE KEY-----'; } > "$RUNNER_TEMP/AuthKey.p8"
      - name: Prebuild the example app (installs pods)
        run: yarn example expo prebuild --platform ios
      - name: Signing (a temporary certificate and App Store profile, made through the key)
        run: |
          SIGN_DIR="$RUNNER_TEMP/signing"; mkdir -p "$SIGN_DIR"
          out=$(node ../../.github/scripts/asc-signing.mjs setup com.vezmo.example "$SIGN_DIR")
          PROFILE_NAME=$(printf '%s\n' "$out" | sed -n 's/^PROFILE_NAME=//p')
          PROFILE_UUID=$(printf '%s\n' "$out" | sed -n 's/^PROFILE_UUID=//p')
          echo "Profile: $PROFILE_NAME"
          # The certificate and its key in a keychain of this run only.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"; KCPASS=$(uuidgen); P12PASS=$(uuidgen)
          /usr/bin/openssl x509 -inform DER -in "$SIGN_DIR/cert.cer" -out "$SIGN_DIR/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SIGN_DIR/key.pem" -in "$SIGN_DIR/cert.pem" -out "$SIGN_DIR/cert.p12" -passout "pass:$P12PASS"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$SIGN_DIR/wwdr.cer"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          security import "$SIGN_DIR/wwdr.cer" -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$SIGN_DIR/cert.p12" -k "$KEYCHAIN" -P "$P12PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$SIGN_DIR/key.pem" "$SIGN_DIR/cert.p12"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$SIGN_DIR/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done
          { echo "SIGN_DIR=$SIGN_DIR"; echo "KEYCHAIN=$KEYCHAIN"; echo "PROFILE_NAME=$PROFILE_NAME"; } >> "$GITHUB_ENV"
      - name: Archive
        working-directory: packages/react-native/example/ios
        run: |
          # Distribution signing on the app target only (the CocoaPods targets keep their own settings).
          perl ../../../../.github/scripts/sign-app-target.pl VezmoExample.xcodeproj/project.pbxproj com.vezmo.example 6SU5Q643PG "$PROFILE_NAME"
          # Each upload needs a higher build number than the last (the generated Info.plist has a fixed one).
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" VezmoExample/Info.plist
          xcodebuild -workspace VezmoExample.xcworkspace -scheme VezmoExample -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/VezmoExample.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" -quiet archive
      - name: Upload to TestFlight
        working-directory: packages/react-native/example/ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>6SU5Q643PG</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.vezmo.example</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/VezmoExample.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the temporary certificate and profile
        if: always()
        run: |
          test -n "$SIGN_DIR" && node ../../.github/scripts/asc-signing.mjs cleanup "$SIGN_DIR" || true
          test -n "$KEYCHAIN" && security delete-keychain "$KEYCHAIN" || true
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

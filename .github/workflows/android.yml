name: Android SDK

# The native Android SDK (packages/android): unit tests, lint, the library and a local Maven publish; then the example
# app pays end to end on a real Android emulator, once per business model (Connect and merchant of record, in
# parallel). Sessions come from dev's demo endpoint (TEST mode only), so this repo holds no key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/android/**'
      - 'e2e/**'
      - '.github/actions/android-emulator/**'
      - '.github/actions/dev-api/**'
      - '.github/actions/maestro/**'
      - '.github/scripts/maestro-test.sh'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/android/**'
      - 'e2e/**'
      - '.github/actions/android-emulator/**'
      - '.github/actions/dev-api/**'
      - '.github/actions/maestro/**'
      - '.github/scripts/maestro-test.sh'
      - '.github/workflows/android.yml'

concurrency:
  group: android-sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: packages/android

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  library:
    name: Library (tests, lint, Maven local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.14.3'
          cache-provider: basic
          cache-read-only: false
      - name: Accept Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
      - name: Unit tests
        run: gradle :checkout:testDebugUnitTest
      - name: Lint
        run: gradle :checkout:lintRelease
      - name: Build the library and publish it to Maven local
        run: gradle :checkout:assembleRelease :checkout:publishToMavenLocal
      - name: Check the local Maven publication
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          DIR=~/.m2/repository/com/vezmo/vezmo-checkout/$VERSION
          ls -la "$DIR"
          for f in aar pom module; do test -s "$DIR/vezmo-checkout-$VERSION.$f" || { echo "::error::missing .$f"; exit 1; }; done
          test -s "$DIR/vezmo-checkout-$VERSION-sources.jar" || { echo "::error::missing sources jar"; exit 1; }
          grep -q '<name>MIT License</name>' "$DIR/vezmo-checkout-$VERSION.pom"
          cat "$DIR/vezmo-checkout-$VERSION.pom"
      - name: Keep test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            packages/android/checkout/build/reports
            packages/android/checkout/build/test-results

  e2e:
    name: Example app on an emulator (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        track: [connect, mor]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.14.3'
          cache-provider: basic
          cache-read-only: false
      - name: Accept Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
      - name: Build the example app and the sheet's screenshot tests
        run: gradle :example:assembleRelease :checkout:assembleDebugAndroidTest
      # The example as an installable APK, to try on a real phone (Google Pay needs a Google account and a Wallet card,
      # which the emulator has not): the dev sandbox, signed with this run's debug key (uninstall an older one first).
      - name: Keep the example APK
        if: matrix.track == 'connect'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: example-apk
          path: packages/android/example/build/outputs/apk/release/example-release.apk
          if-no-files-found: error
      - uses: ./.github/actions/maestro
      - name: Run the flows on an emulator
        uses: ./.github/actions/android-emulator
        with:
          working-directory: packages/android
          # One command per line. Dark mode and the sheet's screenshot tests run once, with the Connect flows.
          script: |
            adb shell settings put global hide_error_dialogs 1
            # Keep the whole run's log: a failure early in the run is otherwise rotated out by the time it is saved.
            adb logcat -G 16M
            adb install example/build/outputs/apk/release/example-release.apk
            ../../.github/scripts/maestro-test.sh ${{ matrix.track }} e2e/out/flows e2e/maestro/flows || (adb exec-out screencap -p > e2e/out/failure.png; adb logcat -d > e2e/out/logcat.txt; exit 1)
            [ ${{ matrix.track }} != connect ] || adb shell "cmd uimode night yes"
            [ ${{ matrix.track }} != connect ] || ../../.github/scripts/maestro-test.sh connect e2e/out/look e2e/maestro/look || (adb exec-out screencap -p > e2e/out/failure-dark.png; adb logcat -d > e2e/out/logcat-dark.txt; exit 1)
            [ ${{ matrix.track }} != connect ] || adb shell "cmd uimode night no"
            [ ${{ matrix.track }} != connect ] || adb install -r checkout/build/outputs/apk/androidTest/debug/checkout-debug-androidTest.apk
            [ ${{ matrix.track }} != connect ] || adb shell am instrument -w -e class com.vezmo.checkout.SheetStatesTest com.vezmo.checkout.test/androidx.test.runner.AndroidJUnitRunner > e2e/out/states.txt
            [ ${{ matrix.track }} != connect ] || cat e2e/out/states.txt
            [ ${{ matrix.track }} != connect ] || adb pull /sdcard/Android/data/com.vezmo.checkout.test/files/states e2e/out/states
            adb logcat -d > e2e/out/logcat.txt
            [ ${{ matrix.track }} != connect ] || grep -q "^OK (" e2e/out/states.txt
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-native-e2e-${{ matrix.track }}
          path: |
            packages/android/e2e/out
            packages/android/*.png

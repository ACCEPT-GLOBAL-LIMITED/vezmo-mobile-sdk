name: Flutter plugin

# The Flutter plugin (packages/flutter): analysis and Dart tests; then its example app, built on the native Android and
# iOS SDKs from this checkout, pays end to end on an Android emulator and an iPhone simulator (plus the sheet in dark
# mode), once per business model (Connect and merchant of record, in parallel). Sessions come from dev's demo endpoint
# (TEST mode only), so this repo holds no key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/flutter/**'
      - 'packages/android/**'
      - 'packages/ios/**'
      - 'Package.swift'
      - 'e2e/**'
      - '.github/actions/android-emulator/**'
      - '.github/actions/ios-simulator/**'
      - '.github/actions/dev-api/**'
      - '.github/actions/maestro/**'
      - '.github/scripts/maestro-test.sh'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/flutter/**'
      - 'packages/android/**'
      - 'packages/ios/**'
      - 'Package.swift'
      - 'e2e/**'
      - '.github/actions/android-emulator/**'
      - '.github/actions/ios-simulator/**'
      - '.github/actions/dev-api/**'
      - '.github/actions/maestro/**'
      - '.github/scripts/maestro-test.sh'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-plugin-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: packages/flutter

env:
  FLUTTER_VERSION: 3.47.7
  VEZMO_API_BASE: https://api.dev.vezmo.com/api/v1
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  dart:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get && (cd example && flutter pub get)
      # Each check runs even when one before it failed, so one run shows every problem.
      - run: flutter test
      - if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Format check
        if: ${{ !cancelled() }}
        run: dart format . && git diff > $RUNNER_TEMP/format.patch && git diff --exit-code --stat
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
      - name: Package check (what pub.dev would see)
        if: ${{ !cancelled() }}
        run: flutter pub publish --dry-run

  android:
    name: Example app on an Android emulator (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        track: [connect, mor]
    env:
      # The plugin resolves the native Android SDK from Maven local (built from this checkout below), not a release.
      ORG_GRADLE_PROJECT_vezmoMavenLocal: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.14.3'
          cache-provider: basic
          cache-read-only: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Accept Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
      - name: Build the native Android SDK into Maven local
        run: gradle -p ../android :checkout:publishToMavenLocal
      - name: Build the example app (release)
        working-directory: packages/flutter/example
        run: flutter build apk --release --target-platform android-x64 --dart-define=VEZMO_API_BASE=$VEZMO_API_BASE
      # The plugin's activity lifecycle (Robolectric, with the native SDK built above and a local server). AGP runs unit
      # tests on the debug build type only.
      - name: Plugin unit tests (Android)
        working-directory: packages/flutter/example/android
        run: ./gradlew :vezmo_checkout:testDebugUnitTest --console=plain
      - uses: ./.github/actions/maestro
      - name: Run the flows on an emulator
        uses: ./.github/actions/android-emulator
        with:
          working-directory: packages/flutter
          # One command per line. The sheet in dark mode (screenshots only) runs once, with the Connect flows.
          script: |
            adb shell settings put global hide_error_dialogs 1
            # Keep the whole run's log: a failure early in the run is otherwise rotated out by the time it is saved.
            adb logcat -G 16M
            adb install example/build/app/outputs/flutter-apk/app-release.apk
            ../../.github/scripts/maestro-test.sh ${{ matrix.track }} e2e/out/flows e2e/maestro/android || (adb exec-out screencap -p > e2e/out/failure.png; adb logcat -d > e2e/out/logcat.txt; exit 1)
            [ ${{ matrix.track }} != connect ] || adb shell "cmd uimode night yes"
            [ ${{ matrix.track }} != connect ] || ../../.github/scripts/maestro-test.sh connect e2e/out/look e2e/maestro/look/android || (adb exec-out screencap -p > e2e/out/failure-dark.png; adb logcat -d > e2e/out/logcat.txt; exit 1)
            [ ${{ matrix.track }} != connect ] || adb shell "cmd uimode night no"
            adb logcat -d > e2e/out/logcat.txt
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-android-e2e-${{ matrix.track }}
          path: |
            packages/flutter/e2e/out
            packages/flutter/*.png

  ios:
    name: Example app on an iPhone simulator (${{ matrix.track }})
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        track: [connect, mor]
    env:
      # Build against this commit's iOS SDK (the Swift package at the repository root), not a published release.
      VEZMO_IOS_SDK_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Booted (and warmed) before the build: a just-booted simulator's first minutes are busy.
      - uses: ./.github/actions/ios-simulator
      # Flutter names the plugin's Swift package after the plugin's folder, and Xcode refuses a package whose folder
      # name differs from its own (packages/flutter vs vezmo_checkout): reach the plugin through a folder named
      # vezmo_checkout, as an app that installs it from pub.dev does.
      - name: Point the example at the plugin as vezmo_checkout
        run: |
          ln -s flutter ../vezmo_checkout
          printf 'dependency_overrides:\n  vezmo_checkout:\n    path: ../../vezmo_checkout\n' > example/pubspec_overrides.yaml
      - name: Build the example app for the simulator
        working-directory: packages/flutter/example
        run: |
          flutter build ios --simulator --debug --dart-define=VEZMO_API_BASE=$VEZMO_API_BASE || {
            ls -la ios/Flutter/ephemeral/Packages/.packages
            cat ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
            find ~/Library/Developer/Xcode/DerivedData -name workspace-state.json -maxdepth 6 -exec cat {} \;
            exit 1
          }
      - uses: ./.github/actions/dev-api
      - name: Run the flows
        run: |
          xcrun simctl install "$UDID" example/build/ios/iphonesimulator/Runner.app
          ../../.github/scripts/maestro-test.sh ${{ matrix.track }} e2e/out-ios/flows e2e/maestro/ios || { xcrun simctl io "$UDID" screenshot e2e/out-ios/failure.png; cp -R ~/Library/Logs/DiagnosticReports e2e/out-ios/crashes 2>/dev/null; exit 1; }
      # The sheet in dark mode: screenshots only (as the Android job and the other SDKs' runs), once.
      - name: The sheet in dark mode
        if: matrix.track == 'connect'
        run: |
          xcrun simctl ui "$UDID" appearance dark
          ../../.github/scripts/maestro-test.sh connect e2e/out-ios/look e2e/maestro/look/ios || { xcrun simctl io "$UDID" screenshot e2e/out-ios/failure-dark.png; exit 1; }
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-ios-e2e-${{ matrix.track }}
          path: packages/flutter/e2e/out-ios/**/*.png
      # Maestro's logs and any crash reports, only when something failed.
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-ios-e2e-logs-${{ matrix.track }}
          path: packages/flutter/e2e/out-ios

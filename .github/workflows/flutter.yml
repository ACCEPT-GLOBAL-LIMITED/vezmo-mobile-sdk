name: Flutter plugin

# The Flutter plugin (packages/flutter): analysis and Dart tests; then its example app, built on the native Android and
# iOS SDKs from this checkout, pays end to end on an Android emulator and an iPhone simulator. Sessions come from dev's
# demo endpoint (TEST mode only), so this repo holds no key.
on:
  workflow_dispatch:
  push:
    branches: [main, flutter]
    paths: ['packages/flutter/**', 'packages/android/**', 'packages/ios/**', 'Package.swift', '.github/workflows/flutter.yml']
  pull_request:
    branches: [main]
    paths: ['packages/flutter/**', 'packages/android/**', 'packages/ios/**', 'Package.swift', '.github/workflows/flutter.yml']

concurrency:
  group: flutter-plugin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/flutter

env:
  FLUTTER_VERSION: 3.47.7
  VEZMO_API_BASE: https://api.dev.vezmo.com/api/v1
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  dart:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get && (cd example && flutter pub get)
      # Each check runs even when one before it failed, so one run shows every problem.
      - run: flutter test
      - if: ${{ !cancelled() }}
        run: flutter analyze
      - name: Format check
        if: ${{ !cancelled() }}
        run: dart format . && git diff > $RUNNER_TEMP/format.patch && git diff --exit-code --stat
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format-patch
          path: ${{ runner.temp }}/format.patch
      - name: Package check (what pub.dev would see)
        if: ${{ !cancelled() }}
        run: flutter pub publish --dry-run

  android:
    name: Example app on an Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.14.3'
          cache-provider: basic
          cache-read-only: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Accept Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
      - name: Build the native Android SDK into Maven local
        # Until com.vezmo:vezmo-checkout is on Maven Central, the plugin resolves it from here.
        run: gradle -p ../android :checkout:publishToMavenLocal
      - name: Build the example app (release)
        working-directory: packages/flutter/example
        run: flutter build apk --release --target-platform android-x64 --dart-define=VEZMO_API_BASE=$VEZMO_API_BASE
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A real phone's size and density (1080x2400, 420 dpi), so screenshots show what buyers see.
          profile: pixel_7
          ram-size: 4096M
          working-directory: packages/flutter
          script: |
            adb shell settings put global hide_error_dialogs 1
            # Keep the whole run's log: a failure early in the run is otherwise rotated out by the time it is saved.
            adb logcat -G 16M
            adb install example/build/app/outputs/flutter-apk/app-release.apk
            mkdir -p e2e/out
            maestro test e2e/maestro/android --format junit --output e2e/out/report.xml --test-output-dir e2e/out || (adb exec-out screencap -p > e2e/out/failure.png; adb logcat -d > e2e/out/logcat.txt; exit 1)
            adb logcat -d > e2e/out/logcat.txt
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-android-e2e
          path: |
            packages/flutter/e2e/out
            packages/flutter/*.png

  ios:
    name: Example app on an iPhone simulator
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Build against this commit's iOS SDK (the Swift package at the repository root), not a published release.
      VEZMO_IOS_SDK_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Flutter names the plugin's Swift package after the plugin's folder, and Xcode refuses a package whose folder
      # name differs from its own (packages/flutter vs vezmo_checkout): reach the plugin through a folder named
      # vezmo_checkout, as an app that installs it from pub.dev does.
      - name: Point the example at the plugin as vezmo_checkout
        run: |
          ln -s flutter ../vezmo_checkout
          printf 'dependency_overrides:\n  vezmo_checkout:\n    path: ../../vezmo_checkout\n' > example/pubspec_overrides.yaml
      - name: Build the example app for the simulator
        working-directory: packages/flutter/example
        run: |
          flutter build ios --simulator --debug --dart-define=VEZMO_API_BASE=$VEZMO_API_BASE || {
            ls -la ios/Flutter/ephemeral/Packages/.packages
            cat ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
            find ~/Library/Developer/Xcode/DerivedData -name workspace-state.json -maxdepth 6 -exec cat {} \;
            exit 1
          }
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          phones = [d for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")]
          pick = next((d for d in phones if d["name"] == "iPhone 16"), phones[-1])
          print(pick["udid"]); print(pick["name"], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the flows
        run: |
          xcrun simctl install "$UDID" example/build/ios/iphonesimulator/Runner.app
          mkdir -p e2e/out-ios
          # The test driver can take a while to start on a cold CI simulator.
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=240000
          flows() { maestro --device "$UDID" test e2e/maestro/ios --test-output-dir e2e/out-ios 2>&1 | tee e2e/maestro.txt; return "${PIPESTATUS[0]}"; }
          # A busy CI Mac sometimes starts Maestro's driver too late: then restart the simulator and try once more
          # (never after a failed flow).
          restart() { xcrun simctl shutdown "$UDID"; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b; }
          flows || { grep -q "iOS driver not ready" e2e/maestro.txt && restart && flows; } || (xcrun simctl io "$UDID" screenshot e2e/out-ios/failure.png; cp -R ~/Library/Logs/DiagnosticReports e2e/out-ios/crashes 2>/dev/null; exit 1)
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-ios-e2e
          path: packages/flutter/e2e/out-ios/**/*.png
      # Maestro's logs and any crash reports, only when something failed.
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-ios-e2e-logs
          path: packages/flutter/e2e/out-ios

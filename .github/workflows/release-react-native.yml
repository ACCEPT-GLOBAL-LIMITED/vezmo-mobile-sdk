name: Release React Native SDK

# Publishes @vezmopay/react-native when a tag like `react-native-v1.2.3` is pushed. The tag's version must match
# packages/react-native/package.json. Signs in to npm with this workflow's GitHub identity (npm trusted publishing:
# the package's npm settings name this repository and `release-react-native.yml`), so no npm token is stored anywhere.
on:
  push:
    tags: ['react-native-v*']
  # Run by hand (Actions → Run workflow) to check that npm trusts this workflow, without publishing anything.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

defaults:
  run:
    working-directory: packages/react-native

jobs:
  check-npm-sign-in:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: npm accepts this workflow's GitHub identity
        working-directory: .
        run: |
          ID=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          # The same exchange `npm publish` makes; the short-lived token it returns is never printed or used.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $ID" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@vezmopay%2freact-native)
          echo "npm answered $CODE"
          case "$CODE" in 2??) ;; *) echo "npm does not trust this workflow: check the package's Trusted Publisher"; exit 1;; esac

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - name: Tag matches the package version
        run: |
          VERSION="${GITHUB_REF_NAME#react-native-v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$VERSION" = "$PKG" ] || { echo "Tag $VERSION does not match package.json $PKG"; exit 1; }
      - run: yarn typecheck
      - run: yarn test --maxWorkers=2
      - run: yarn prepare
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/react-native/.nvmrc
          registry-url: https://registry.npmjs.org
      - name: Publish
        run: npm publish --access public --provenance

name: Bug report
description: Something in a Vezmo mobile SDK doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include API keys, client tokens or buyers' details.
        Security problems: report them privately (see SECURITY.md), not here.
  - type: dropdown
    id: sdk
    attributes:
      label: SDK
      options:
        - React Native
        - iOS
        - Android
        - Flutter
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      description: The phone or simulator and its OS version, plus React Native, Expo, Xcode or Flutter versions where relevant.
      placeholder: "iPhone 16, iOS 18.5, Xcode 16.4"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code and steps that show the problem.
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Error codes and messages, logs or screenshots help.
    validations:
      required: true

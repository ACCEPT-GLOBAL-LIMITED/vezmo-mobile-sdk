# Links the sandbox's "Success" test bank in the bank step that the Instant ACH row opens, and comes back to the sheet
# with it (SHOT names the screenshots). The bank step is the payment engine's own: its sheet ("Add bank account"), then
# its bank-connection pages (consent, the buyer's wallet sign-in by email and code, the bank, the account). In the
# sandbox the code is any six digits and the "Success" bank needs no login. Nothing is paid here: Pay comes after.
appId: com.vezmo.example # a shared subflow: it acts on whatever app the calling flow has open
---
- extendedWaitUntil:
    visible: "(?i)(add bank account|continue)"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}-02-bank-step
- tapOn: "(?i)(add bank account|continue)"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${SHOT}-03-connect
# A fresh emulator's browser asks its first-run questions before showing a page.
- tapOn:
    text: "(?i)(use without an account|accept & continue|accept and continue)"
    optional: true
- tapOn:
    text: "(?i)(no thanks|no, thanks)"
    optional: true
- extendedWaitUntil:
    visible: "(?i).*(agree and continue|agree|verification code|enter the code|continue with link|success).*"
    timeout: 60000
    optional: true
- takeScreenshot: ${SHOT}-03b-first-page
- tapOn:
    text: "(?i)(agree and continue|agree)"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${SHOT}-03c-after-consent
# The buyer's email is the session's: an earlier run signed it up, so it asks for the code sent to its phone (any six
# digits in the sandbox); or this run signs it up with a phone number (a fictional 555 one).
- extendedWaitUntil:
    visible: "(?i).*(phone number|code|confirm it|success).*"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "(?i)phone number"
    commands:
      - inputText: "2015550123"
      - takeScreenshot: ${SHOT}-03d-sign-up
      - pressKey: Enter
      - waitForAnimationToEnd:
          timeout: 10000
- runFlow:
    when:
      visible: "(?i)phone number"
    commands:
      - hideKeyboard
      - takeScreenshot: ${SHOT}-03d-sign-up-button
      - tapOn: "(?i)(continue|agree and continue|sign up|join link|save)"
      - waitForAnimationToEnd:
          timeout: 10000
- runFlow:
    when:
      visible: "(?i).*(verification code|enter the code|we sent|sent a code|confirm it).*"
    commands:
      - takeScreenshot: ${SHOT}-03d-code
      - inputText: "123456"
      - waitForAnimationToEnd:
          timeout: 10000
- takeScreenshot: ${SHOT}-03e-before-bank
- extendedWaitUntil:
    visible: "Success"
    timeout: 60000
- takeScreenshot: ${SHOT}-04-banks
- tapOn: "Success"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${SHOT}-05-accounts
- tapOn:
    text: "(?i)(connect account|connect accounts|link account|link accounts|confirm)"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${SHOT}-05b-linked
- tapOn:
    text: "(?i)(done|back to .*)"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${SHOT}-06-back-in-step
# The bank step's sheet with the bank linked: Continue brings it to the Instant ACH row.
- tapOn:
    text: "(?i)continue"
    optional: true

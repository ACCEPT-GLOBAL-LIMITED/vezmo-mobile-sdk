# Links the sandbox's "Success" test bank in the bank step that the Instant ACH row opens, and comes back to the sheet
# with it (SHOT names the screenshots). The bank step is the payment engine's own: its sheet, then its bank-connection
# pages. Which pages come, and in which order, depends on whether the session's buyer email already has the engine's
# wallet (an earlier run made it): consent, then either a sign-up (a phone number) or a sign-in (a code; any six digits
# in the sandbox), then the bank or the account saved before. Each page is answered when it shows. Nothing is paid
# here: Pay comes after.
appId: com.vezmo.example # a shared subflow: it acts on whatever app the calling flow has open
---
- extendedWaitUntil:
    visible: "(?i)(add bank account|continue)"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}-02-bank-step
- tapOn: "(?i)(add bank account|continue)"
- extendedWaitUntil:
    visible: "(?i).*(agree and continue|continue with link|phone number|success).*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT}-03-connect
- repeat:
    times: 8
    while:
      notVisible: "(?i).*success.*"
    commands:
      # A returning buyer: the wallet offers itself.
      - runFlow:
          when:
            visible: "(?i)continue with link"
          commands:
            - takeScreenshot: ${SHOT}-03a-returning
            - tapOn: "Continue"
            - waitForAnimationToEnd:
                timeout: 10000
      - runFlow:
          when:
            visible: "(?i)agree and continue"
          commands:
            - takeScreenshot: ${SHOT}-03b-consent
            - tapOn: "(?i)agree and continue"
            - waitForAnimationToEnd:
                timeout: 10000
      # A new buyer: the wallet's sign-up asks for a phone (a fictional 555 number).
      - runFlow:
          when:
            visible: "(?i)phone number"
          commands:
            - eraseText: 20
            - inputText: "2015550123"
            - takeScreenshot: ${SHOT}-03c-sign-up
            - pressKey: Enter
            - waitForAnimationToEnd:
                timeout: 10000
      # A returning buyer signs in with the code sent to their phone.
      - runFlow:
          when:
            visible: "(?i).*(verification code|enter the code|sent a code|we sent|confirm it).*"
          commands:
            - takeScreenshot: ${SHOT}-03d-code
            - inputText: "123456"
            - waitForAnimationToEnd:
                timeout: 10000
      - extendedWaitUntil:
          visible: "(?i).*(success|agree and continue|continue with link|phone number|code|confirm it).*"
          timeout: 20000
          optional: true
- takeScreenshot: ${SHOT}-04-banks
- tapOn: "(?i)success.*"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${SHOT}-05-accounts
- tapOn:
    text: "(?i)(connect account|connect accounts|link account|link accounts|confirm)"
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: ${SHOT}-05b-linked
- tapOn:
    text: "(?i)(done|back to .*)"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${SHOT}-06-back-in-step
# The bank step's sheet with the bank linked: Continue brings it to the Instant ACH row.
- tapOn:
    text: "(?i)continue"
    optional: true
